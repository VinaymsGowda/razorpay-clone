spring:
  application:
    name: razorpayclone
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  task:
    scheduling:
      pool:
        size: 4
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        max.block.ms: 5000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
vault:
  DEK_ENCRYPTION_KEY: ${DEK_ENCRYPTION_KEY}

jwt:
  secret-key: ${SECRET_KEY}

payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80


api-key:
  rate-limit:
    requests-per-minute: 70

outbox:
  poller:
    delay-ms: 2000
    batch-size: 50
    send-timeout-ms: 10000
  cleanup:
    retention-days: 20
    cron: "0 0 3 * * *"

kafka:
  partitions: 3
  replicas: 1
  topics:
    payment: payments.events
    order: orders.events
    refund: refund.events
    settlement: settlement.events